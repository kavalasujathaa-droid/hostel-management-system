name: Android CI Cloud Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build, Test & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x frontend/gradlew

      - name: Run Unit Tests
        working-directory: ./frontend
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Run Kotlin Compilation
        working-directory: ./frontend
        run: ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Run Android Lint Check
        working-directory: ./frontend
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Generate Debug APK
        working-directory: ./frontend
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: hostel-management-debug-apk
          path: frontend/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Unit Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: frontend/app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

      - name: Upload Android Lint Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-reports
          path: |
            frontend/app/build/reports/lint-results-debug.html
            frontend/app/build/reports/lint-results-debug.xml
          retention-days: 7
